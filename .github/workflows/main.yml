
name: Build AI Army Orbital Stage 0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found in repository root"
            exit 1
          fi
          unzip -q "$ZIP" -d source
          find source -maxdepth 4 -type f | head -100

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Paper and Fabric
        working-directory: source
        run: |
          BUILD_FILE=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          cd "$(dirname "$BUILD_FILE")"
          gradle build --no-daemon

      - name: Upload JAR files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-army-orbital-stage0-jars
          path: |
            source/**/*.jar
          if-no-files-found: error
